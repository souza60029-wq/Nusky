name: iOS

on:
  push:
    # Mudança só na lista de sites não gera IPA. Para incluir a lista nova no app,
    # rode manualmente em Actions > iOS > Run workflow.
    paths-ignore:
      - "dados/**"
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Preparar ícone (recorte e 1024 × 1024)
        run: |
          ICONE=app/Nusky/Assets.xcassets/AppIcon.appiconset/icon.png
          sips -g pixelWidth -g pixelHeight "$ICONE"
          sips -c 1000 1000 --cropOffset 127 127 "$ICONE"
          sips -z 1024 1024 "$ICONE"
          sips -g pixelWidth -g pixelHeight "$ICONE"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Compilar motor (Rust)
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: cargo build --release --target aarch64-apple-ios --manifest-path engine/Cargo.toml

      - name: Instalar XcodeGen e ldid
        run: brew install xcodegen ldid

      - name: Gerar projeto Xcode
        run: xcodegen generate

      - name: Compilar app
        run: |
          xcodebuild \
            -project Nusky.xcodeproj \
            -scheme Nusky \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Assinar com entitlements de JIT
        run: ldid -Sentitlements.plist build/Build/Products/Release-iphoneos/Nusky.app/Nusky

      - name: Empacotar IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Nusky.app Payload/
          zip -r Nusky-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Nusky
          path: Nusky-unsigned.ipa