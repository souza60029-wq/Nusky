name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path engine/Cargo.toml

  build-engine-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - run: cargo build --release --target aarch64-apple-ios --manifest-path engine/Cargo.toml
      - name: Verificar biblioteca estática
        run: ls -lh engine/target/aarch64-apple-ios/release/libnusky_engine.a
      - uses: actions/upload-artifact@v4
        with:
          name: libnusky_engine-ios
          path: engine/target/aarch64-apple-ios/release/libnusky_engine.a