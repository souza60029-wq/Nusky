[package]
name = "nusky-engine"
version = "0.0.3"
edition = "2021"
license = "MPL-2.0"
description = "Motor de renderização do navegador Nusky"

[lib]
name = "nusky_engine"
# staticlib: para o Swift linkar no iPhone. rlib: para os testes em Rust.
crate-type = ["staticlib", "rlib"]

[dependencies]
serde_json = "1"